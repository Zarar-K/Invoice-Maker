<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice & Quotation Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  background:#e5e7eb;
}

.tab.active{
  background:#111827;
  color:white;
}

.primary{
  background:#2563eb;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.secondary{
  background:#6b7280;
  color:white;
}

.item{
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
}

.item-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:8px;
  align-items:end;
}

.remove{
  background:#dc2626;
  color:white;
  margin:0;
}

.total-box{
  background:#f9fafb;
  padding:15px;
  border-radius:8px;
  margin-top:15px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.grand-total{
  font-size:20px;
  font-weight:bold;
  border-top:1px solid #ddd;
  padding-top:10px;
}

.output{
  display:none;
  background:white;
  padding:30px;
  margin-top:20px;
}

.output-header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #111827;
  padding-bottom:15px;
}

.output table{
  width:100%;
  border-collapse:collapse;
  margin-top:25px;
}

.output th,
.output td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
}

.output th{
  background:#f3f4f6;
}

.output-total{
  margin-top:20px;
  margin-left:auto;
  max-width:300px;
}

.actions{
  text-align:center;
  margin-top:20px;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .item-grid{
    grid-template-columns:1fr;
  }

  .output-header{
    flex-direction:column;
  }

  .output{
    padding:15px;
  }
}

@media print{

  body{
    background:white;
  }

  .container > *:not(.output){
    display:none !important;
  }

  .output{
    display:block !important;
    box-shadow:none;
    margin:0;
  }

  .actions{
    display:none;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Invoice & Quotation Maker</h1>

<div class="card">

<div class="tabs">

<button id="invoiceTab"
class="tab active"
onclick="setType('Invoice')">
Invoice
</button>

<button id="quotationTab"
class="tab"
onclick="setType('Quotation')">
Quotation
</button>

</div>

<h2>Business Information</h2>

<label>Business Name</label>
<input id="businessName" placeholder="Your Business Name">

<label>Phone</label>
<input id="businessPhone" placeholder="03XXXXXXXXX">

<label>Address</label>
<input id="businessAddress" placeholder="Business Address">

<div>
<button class="success" onclick="saveBusinessProfile()">
Save Business Profile
</button>

<button class="secondary" onclick="clearBusinessProfile()">
Clear Saved Profile
</button>
</div>

</div>


<div class="card">

<h2>Customer Information</h2>

<label>Customer Name</label>
<input id="customerName" placeholder="Customer Name">

<label>Customer Phone</label>
<input id="customerPhone" placeholder="03XXXXXXXXX">

</div>


<div class="card">

<h2>Document Information</h2>

<label>Document Number</label>
<input id="documentNumber" placeholder="INV-001">

<label>Date</label>
<input type="date" id="documentDate">

</div>


<div class="card">

<h2>Products / Services</h2>

<div id="items"></div>

<button class="primary" onclick="addItem()">
+ Add Product / Service
</button>

</div>


<div class="card">

<h2>Discount</h2>

<label>Discount</label>
<input
type="number"
id="discount"
value="0"
min="0"
oninput="calculateTotal()"
>

<div class="total-box">

<div class="total-row">
<span>Subtotal</span>
<strong>Rs <span id="subtotal">0.00</span></strong>
</div>

<div class="total-row">
<span>Discount</span>
<strong>Rs <span id="discountAmount">0.00</span></strong>
</div>

<div class="total-row grand-total">
<span>Total</span>
<strong>Rs <span id="total">0.00</span></strong>
</div>

</div>

<button class="primary" onclick="generateDocument()">
Generate Document
</button>

</div>


<div id="output" class="output">

<div class="output-header">

<div>

<h1 id="outputTitle">INVOICE</h1>

<h2 id="outBusiness">Business Name</h2>

<div id="outPhone"></div>

<div id="outAddress"></div>

</div>

<div>

<div>
<strong>Customer:</strong>
<span id="outCustomer"></span>
</div>

<div>
<strong>Phone:</strong>
<span id="outCustomerPhone"></span>
</div>

<div>
<strong>No:</strong>
<span id="outNumber"></span>
</div>

<div>
<strong>Date:</strong>
<span id="outDate"></span>
</div>

</div>

</div>


<table>

<thead>

<tr>
<th>Description</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>

</thead>

<tbody id="outItems"></tbody>

</table>


<div class="output-total">

<div class="total-row">
<span>Subtotal</span>
<strong>Rs <span id="outSubtotal">0.00</span></strong>
</div>

<div class="total-row">
<span>Discount</span>
<strong>Rs <span id="outDiscount">0.00</span></strong>
</div>

<div class="total-row grand-total">
<span>Total</span>
<strong>Rs <span id="outTotal">0.00</span></strong>
</div>

</div>


<div class="actions">

<button class="success" onclick="window.print()">
Print / Save PDF
</button>

</div>

</div>

</div>


<script>

let currentType = "Invoice";
let itemCounter = 0;


/* -------------------------
   DOCUMENT TYPE
------------------------- */

function setType(type){

  currentType = type;

  const invoiceTab = document.getElementById("invoiceTab");
  const quotationTab = document.getElementById("quotationTab");

  invoiceTab.classList.remove("active");
  quotationTab.classList.remove("active");

  if(type === "Invoice"){
    invoiceTab.classList.add("active");
  }else{
    quotationTab.classList.add("active");
  }

}


/* -------------------------
   ADD ITEM
------------------------- */

function addItem(){

  itemCounter++;

  const items = document.getElementById("items");

  const div = document.createElement("div");

  div.className = "item";

  div.id = "item-" + itemCounter;

  div.innerHTML = `

    <div class="item-grid">

      <div>
        <label>Product / Service</label>
        <input
          class="item-name"
          placeholder="Product name"
          oninput="calculateTotal()"
        >
      </div>

      <div>
        <label>Qty</label>
        <input
          type="number"
          class="item-qty"
          value="1"
          min="1"
          oninput="calculateTotal()"
        >
      </div>

      <div>
        <label>Price</label>
        <input
          type="number"
          class="item-price"
          value="0"
          min="0"
          oninput="calculateTotal()"
        >
      </div>

      <button
        class="remove"
        onclick="removeItem(${itemCounter})">
        Remove
      </button>

    </div>

  `;

  items.appendChild(div);

  calculateTotal();
}


/* -------------------------
   REMOVE ITEM
------------------------- */

function removeItem(id){

  const item = document.getElementById("item-" + id);

  if(item){
    item.remove();
  }

  calculateTotal();
}


/* -------------------------
   CALCULATE TOTAL
------------------------- */

function calculateTotal(){

  let subtotal = 0;

  const items = document.querySelectorAll(".item");

  items.forEach(item => {

    const qty =
      parseFloat(item.querySelector(".item-qty").value) || 0;

    const price =
      parseFloat(item.querySelector(".item-price").value) || 0;

    subtotal += qty * price;

  });


  const discount =
    parseFloat(document.getElementById("discount").value) || 0;

  const total = Math.max(subtotal - discount, 0);


  document.getElementById("subtotal").textContent =
    subtotal.toFixed(2);

  document.getElementById("discountAmount").textContent =
    discount.toFixed(2);

  document.getElementById("total").textContent =
    total.toFixed(2);

}


/* -------------------------
   GENERATE DOCUMENT
------------------------- */

function generateDocument(){

  calculateTotal();

  const businessName =
    document.getElementById("businessName").value;

  const businessPhone =
    document.getElementById("businessPhone").value;

  const businessAddress =
    document.getElementById("businessAddress").value;

  const customerName =
    document.getElementById("customerName").value;

  const customerPhone =
    document.getElementById("customerPhone").value;

  const documentNumber =
    document.getElementById("documentNumber").value;

  const documentDate =
    document.getElementById("documentDate").value;

  const discount =
    parseFloat(document.getElementById("discount").value) || 0;


  document.getElementById("outputTitle").textContent =
    currentType.toUpperCase();

  document.getElementById("outBusiness").textContent =
    businessName || "Business Name";

  document.getElementById("outPhone").textContent =
    businessPhone || "";

  document.getElementById("outAddress").textContent =
    businessAddress || "";

  document.getElementById("outCustomer").textContent =
    customerName || "-";

  document.getElementById("outCustomerPhone").textContent =
    customerPhone || "-";

  document.getElementById("outNumber").textContent =
    documentNumber || "-";

  document.getElementById("outDate").textContent =
    documentDate || "-";


  const outItems =
    document.getElementById("outItems");

  outItems.innerHTML = "";

  let subtotal = 0;


  document.querySelectorAll(".item").forEach(item => {

    const name =
      item.querySelector(".item-name").value || "Item";

    const qty =
      parseFloat(item.querySelector(".item-qty").value) || 0;

    const price =
      parseFloat(item.querySelector(".item-price").value) || 0;

    const lineTotal = qty * price;

    subtotal += lineTotal;


    const row = document.createElement("tr");

    row.innerHTML = `

      <td>${escapeHTML(name)}</td>

      <td>${qty}</td>

      <td>Rs ${price.toFixed(2)}</td>

      <td>Rs ${lineTotal.toFixed(2)}</td>

    `;

    outItems.appendChild(row);

  });


  const total = Math.max(subtotal - discount, 0);


  document.getElementById("outSubtotal").textContent =
    subtotal.toFixed(2);

  document.getElementById("outDiscount").textContent =
    discount.toFixed(2);

  document.getElementById("outTotal").textContent =
    total.toFixed(2);


  document.getElementById("output").style.display =
    "block";


  document.getElementById("output").scrollIntoView({
    behavior:"smooth"
  });

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHTML(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* -------------------------
   SAVE BUSINESS PROFILE
------------------------- */

function saveBusinessProfile(){

  const profile = {

    name:
      document.getElementById("businessName").value,

    phone:
      document.getElementById("businessPhone").value,

    address:
      document.getElementById("businessAddress").value

  };


  localStorage.setItem(
    "invoiceBusinessProfile",
    JSON.stringify(profile)
  );


  alert("Business profile saved successfully!");

}


/* -------------------------
   LOAD BUSINESS PROFILE
------------------------- */

function loadBusinessProfile(){

  const saved =
    localStorage.getItem("invoiceBusinessProfile");

  if(!saved){
    return;
  }


  try{

    const profile =
      JSON.parse(saved);


    document.getElementById("businessName").value =
      profile.name || "";

    document.getElementById("businessPhone").value =
      profile.phone || "";

    document.getElementById("businessAddress").value =
      profile.address || "";

  }catch(error){

    console.log("Saved profile could not be loaded.");

  }

}


/* -------------------------
   CLEAR PROFILE
------------------------- */

function clearBusinessProfile(){

  localStorage.removeItem("invoiceBusinessProfile");

  document.getElementById("businessName").value = "";

  document.getElementById("businessPhone").value = "";

  document.getElementById("businessAddress").value = "";

  alert("Saved business profile cleared.");

}


/* -------------------------
   INITIAL SETUP
------------------------- */

document.addEventListener("DOMContentLoaded", function(){

  loadBusinessProfile();

  document.getElementById("documentDate").value =
    new Date().toISOString().split("T")[0];

  addItem();

});

</script>

</body>
  </html>
