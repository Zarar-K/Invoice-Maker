<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice & Quotation Maker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827
}

.container{
max-width:900px;
margin:auto;
padding:20px
}

h1{text-align:center}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:18px;
box-shadow:0 2px 10px rgba(0,0,0,.08)
}

input{
width:100%;
padding:12px;
margin:6px 0 12px;
border:1px solid #d1d5db;
border-radius:8px;
font-size:15px
}

button{
border:0;
padding:12px 18px;
border-radius:8px;
color:white;
background:#111827;
font-size:15px;
margin:4px;
cursor:pointer
}

button:hover{opacity:.9}

.tabs{
display:flex;
gap:8px;
margin-bottom:18px
}

.tab{
flex:1;
background:#2563eb
}

.tab.active{
background:#16a34a
}

.add{background:#2563eb}
.remove{background:#dc2626}

.generate{
background:#16a34a;
width:100%;
font-size:17px
}

.item{
border:1px solid #e5e7eb;
padding:12px;
border-radius:8px;
margin-bottom:10px
}

.document{
display:none;
background:white;
padding:30px;
margin-top:20px
}

.header{
display:flex;
justify-content:space-between;
gap:20px;
border-bottom:2px solid #111827;
padding-bottom:15px
}

.title{
font-size:30px;
font-weight:bold
}

table{
width:100%;
border-collapse:collapse;
margin-top:25px
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left
}

.summary{
text-align:right;
margin-top:20px
}

.grand{
font-size:24px;
font-weight:bold
}

@media(max-width:600px){
.header{flex-direction:column}
.document{padding:18px}
table{font-size:13px}
}

@media print{
body{background:white}

.container>*:not(.document){
display:none
}

.document{
display:block!important;
box-shadow:none;
margin:0
}

.print-hide{
display:none!important
}

@page{
margin:15mm
}
}
</style>
</head>

<body>

<div class="container">

<h1>🧾 Business Document Maker</h1>

<div class="tabs">
<button id="invoiceTab" class="tab active"
onclick="setType('Invoice')">
Invoice
</button>

<button id="quotationTab" class="tab"
onclick="setType('Quotation')">
Quotation
</button>
</div>

<div class="card">

<h2>Business Information</h2>

<input id="businessName"
placeholder="Business Name">

<input id="businessPhone"
placeholder="Phone Number">

<input id="businessAddress"
placeholder="Business Address">

</div>

<div class="card">

<h2>Customer Information</h2>

<input id="customerName"
placeholder="Customer Name">

<input id="customerPhone"
placeholder="Customer Phone">

</div>

<div class="card">

<h2>Document Information</h2>

<input id="documentNumber"
placeholder="Document Number">

<input id="documentDate"
type="date">

</div>

<div class="card">

<h2>Products / Services</h2>

<div id="items"></div>

<button class="add"
onclick="addItem()">
+ Add Product
</button>

</div>

<div class="card">

<h2>Discount</h2>

<input id="discount"
type="number"
value="0"
placeholder="Discount">

<button class="generate"
onclick="generateDocument()">
Generate Document
</button>

</div>

<div id="document"
class="document">

<div class="header">

<div>
<div id="outputTitle" class="title">
INVOICE
</div>

<h2 id="outBusiness"></h2>

<div id="outPhone"></div>

<div id="outAddress"></div>
</div>

<div>
<strong>Number:</strong>
<span id="outNumber"></span>

<br>

<strong>Date:</strong>
<span id="outDate"></span>
</div>

</div>

<div style="margin-top:25px">

<strong>Bill / Prepared For:</strong>

<div id="outCustomer"></div>

<div id="outCustomerPhone"></div>

</div>

<table>

<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</thead>

<tbody id="outItems"></tbody>

</table>

<div class="summary">

<div>
Subtotal:
<strong>Rs <span id="outSubtotal">0</span></strong>
</div>

<div>
Discount:
<strong>Rs <span id="outDiscount">0</span></strong>
</div>

<div class="grand">
Total:
Rs <span id="outTotal">0</span>
</div>

</div>

<div class="print-hide"
style="text-align:center;margin-top:35px">

<button onclick="window.print()">
🖨️ Print / Save PDF
</button>

</div>

</div>

</div>

<script>

let itemCount=0;
let documentType="Invoice";

function setType(type){

documentType=type;

document.getElementById("outputTitle")
.textContent=type.toUpperCase();

document.getElementById("invoiceTab")
.classList.toggle("active",type==="Invoice");

document.getElementById("quotationTab")
.classList.toggle("active",type==="Quotation");

}

function addItem(){

itemCount++;

const div=document.createElement("div");

div.className="item";

div.id="item"+itemCount;

div.innerHTML=`

<input class="itemName"
placeholder="Product / Service">

<input class="itemQty"
type="number"
value="1"
min="1"
placeholder="Quantity">

<input class="itemPrice"
type="number"
value="0"
min="0"
placeholder="Price">

<button class="remove"
onclick="removeItem(${itemCount})">
Remove
</button>

`;

document
.getElementById("items")
.appendChild(div);

}

function removeItem(id){

const item=document.getElementById("item"+id);

if(item)item.remove();

}

function generateDocument(){

const businessName=
document.getElementById("businessName").value
||"Your Business";

const phone=
document.getElementById("businessPhone").value;

const address=
document.getElementById("businessAddress").value;

const customer=
document.getElementById("customerName").value
||"Customer";

const customerPhone=
document.getElementById("customerPhone").value;

const number=
document.getElementById("documentNumber").value
||"001";

const date=
document.getElementById("documentDate").value
||new Date().toLocaleDateString();

const discount=
Number(document.getElementById("discount").value)||0;

document.getElementById("outputTitle")
.textContent=documentType.toUpperCase();

document.getElementById("outBusiness")
.textContent=businessName;

document.getElementById("outPhone")
.textContent=phone;

document.getElementById("outAddress")
.textContent=address;

document.getElementById("outCustomer")
.textContent=customer;

document.getElementById("outCustomerPhone")
.textContent=customerPhone;

document.getElementById("outNumber")
.textContent=number;

document.getElementById("outDate")
.textContent=date;

const items=document.querySelectorAll(".item");

const output=document.getElementById("outItems");

output.innerHTML="";

let subtotal=0;

items.forEach(item=>{

const name=
item.querySelector(".itemName").value
||"Item";

const qty=
Number(item.querySelector(".itemQty").value)
||0;

const price=
Number(item.querySelector(".itemPrice").value)
||0;

const total=qty*price;

subtotal+=total;

const row=document.createElement("tr");

const nameCell=document.createElement("td");
nameCell.textContent=name;

const qtyCell=document.createElement("td");
qtyCell.textContent=qty;

const priceCell=document.createElement("td");
priceCell.textContent=
"Rs "+price.toLocaleString();

const totalCell=document.createElement("td");
totalCell.textContent=
"Rs "+total.toLocaleString();

row.appendChild(nameCell);
row.appendChild(qtyCell);
row.appendChild(priceCell);
row.appendChild(totalCell);

output.appendChild(row);

});

const finalTotal=
Math.max(0,subtotal-discount);

document.getElementById("outSubtotal")
.textContent=subtotal.toLocaleString();

document.getElementById("outDiscount")
.textContent=discount.toLocaleString();

document.getElementById("outTotal")
.textContent=finalTotal.toLocaleString();

document.getElementById("document")
.style.display="block";

document.getElementById("document")
.scrollIntoView({
behavior:"smooth"
});

}

addItem();

document.getElementById("documentDate")
.value=new Date()
.toISOString()
.split("T")[0];

</script>

</body>
</html>
